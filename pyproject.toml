[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semn"
version = "0.1.0"
description = "Systematic equity research platform: point-in-time data, factor risk, cross-sectional alpha, validation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
# Later phases add their own dependencies when they first import them.
dependencies = [
    "polars>=1.25",
    "pyarrow>=14.0",
    "numpy>=1.26",
    "exchange_calendars>=4.5",
]

[project.optional-dependencies]
clickhouse = ["clickhouse-connect>=0.7", "pandas>=2.2"]
report = ["matplotlib>=3.8", "weasyprint>=61.0"]
hawkes = ["tick>=0.7"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pandas>=2.2", "pybind11>=2.12"]

[tool.setuptools.packages.find]
include = ["semn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
