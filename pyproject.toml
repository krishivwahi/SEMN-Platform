[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semn"
version = "0.1.0"
description = "Systematic equity research platform: point-in-time data, factor risk, cross-sectional alpha, validation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "pyarrow>=14.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "catboost>=1.2",
    "cvxpy>=1.4",
    "osqp>=0.6",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
clickhouse = ["clickhouse-connect>=0.7", "pandas>=2.2"]
report = ["matplotlib>=3.8", "weasyprint>=61.0"]
hawkes = ["tick>=0.7"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pandas>=2.2", "pybind11>=2.12"]

[tool.setuptools.packages.find]
include = ["semn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
